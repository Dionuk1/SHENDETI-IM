<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHËNDETI IM | Administrim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { --primary:#0062ff; --dark:#0f172a; --bg:#f8fbff; --gray:#64748b; --danger:#ef4444; }
        * { box-sizing:border-box; font-family:Arial,sans-serif; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--dark); padding:20px; }
        main { width:min(440px,100%); background:white; border-radius:28px; padding:35px; box-shadow:0 15px 35px rgba(0,98,255,.1); }
        .brand { display:flex; justify-content:center; align-items:center; gap:10px; color:var(--primary); font-weight:800; font-size:1.2rem; }
        .brand img { width:auto; height:58px; object-fit:contain; }
        h1 { text-align:center; font-size:1.6rem; margin:10px 0 22px; }
        label { display:block; font-weight:700; font-size:.85rem; margin:12px 0 7px; }
        input { width:100%; padding:14px 16px; border:1px solid #e2e8f0; border-radius:12px; font-size:1rem; }
        input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 4px rgba(0,98,255,.14); }
        button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:12px; background:var(--primary); color:white; font-weight:700; cursor:pointer; }
        #notice { min-height:20px; color:var(--danger); text-align:center; margin-top:12px; font-size:.9rem; }
        a { display:block; text-align:center; margin-top:14px; color:var(--gray); text-decoration:none; }
    </style>
</head>
<body>
    <main>
        <div class="brand"><img src="/favicon.svg" alt="Logoja e SHËNDETI IM"><span>SHËNDETI IM</span></div>
        <h1>Hyrja e administrimit</h1>
        <form id="adminLoginForm">
            <label for="email">Adresa e emailit</label>
            <input id="email" type="email" placeholder="admin@shendeti-im.test" autocomplete="username" required>
            <label for="password">Fjalëkalimi</label>
            <input id="password" type="password" autocomplete="current-password" required>
            <button id="adminLoginSubmit" type="submit">Kyçu</button>
            <div id="notice" role="status"></div>
        </form>
        <a href="/">Anulo</a>
    </main>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            if (form.dataset.submitting === 'true') return;
            const submitButton = document.getElementById('adminLoginSubmit');
            form.dataset.submitting = 'true';
            submitButton.disabled = true;
            const notice = document.getElementById('notice');
            notice.textContent = '';
            try {
                const response = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim().toLowerCase(),
                        password: document.getElementById('password').value,
                    }),
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data?.user?.role !== 'admin') throw new Error('Kredencialet janë të pavlefshme.');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('role', data.user.role);
                window.location.replace('/?admin=1');
            } catch (error) {
                notice.textContent = error.message || 'Hyrja dështoi.';
            } finally {
                document.getElementById('password').value = '';
                form.dataset.submitting = 'false';
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
